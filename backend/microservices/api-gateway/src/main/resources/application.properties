# ======================================================================
#  API Gateway - point d'entrée unique du JobBoard
# ======================================================================
spring.application.name=gateway
# 8080-8085 sont déjà pris (candidat 8081, job 8082, meeting 8083,
# notification 8084, candidature 8085) -> la Gateway écoute sur 8888
server.port=8888

# Profil utilisé si aucun n'est choisi au lancement.
# Changer de méthode : IntelliJ > Edit Configurations > Active profiles
#   static-java | static-props | dynamic-java | dynamic-props | dynamic-java,random-lb
spring.profiles.default=static-java

# ---------------- Eureka (utilisé par les profils dynamiques) ----------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Rafraîchir la liste des instances plus souvent (défaut 30 s) pour les tests
eureka.client.registry-fetch-interval-seconds=5

# ---------------- Actuator : voir les routes actives ----------------
# http://localhost:8888/actuator/gateway/routes
management.endpoints.web.exposure.include=health,info,gateway

# ---------------- Partie 3 - Q2.a : logs de routage ----------------
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
# Ligne "LoadBalancerClientFilter url chosen: http://<ip>:<port>/..." = instance choisie
logging.level.org.springframework.cloud.gateway.filter.ReactiveLoadBalancerClientFilter=TRACE
logging.level.org.springframework.cloud.loadbalancer=DEBUG
