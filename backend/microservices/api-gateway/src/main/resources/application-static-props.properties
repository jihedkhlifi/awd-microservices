# ======================================================================
#  Partie 2 - Méthode 2 : routes STATIQUES dans le fichier properties
#  uri = adresse fixe du microservice -> Eureka n'est pas utilisé
#
#  NB : depuis Spring Cloud 2025.0 le préfixe "spring.cloud.gateway.routes" (PDF)
#       devient "spring.cloud.gateway.server.webflux.routes".
# ======================================================================
eureka.client.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=candidat
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/mic1/**

spring.cloud.gateway.server.webflux.routes[1].id=job
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/jobs/**,/api/categories/**

spring.cloud.gateway.server.webflux.routes[2].id=meeting
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/meetings/**

spring.cloud.gateway.server.webflux.routes[3].id=notification
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.server.webflux.routes[4].id=candidature
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/mic3/**
