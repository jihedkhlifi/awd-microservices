spring.application.name=job
# Tests use an in-memory H2 database in MySQL mode, so MySQL does not need to be running
spring.datasource.url=jdbc:h2:mem:job_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Pas de serveur Eureka pendant les tests
eureka.client.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=job
info.app.version=1.0.0
