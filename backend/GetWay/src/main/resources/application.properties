spring.application.name=gateway
server.port=8086

spring.profiles.group.static-properties=static
spring.profiles.group.static-java=static,java-routes
spring.profiles.group.eureka-java=java-routes

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Eureka met deja en cache son registre.
spring.cloud.loadbalancer.cache.enabled=false

gateway.services.candidat=lb://candidat
gateway.services.job=lb://job
gateway.services.candidature=lb://candidature
gateway.services.meeting=lb://meeting
gateway.services.notification=lb://notification

springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Candidat
springdoc.swagger-ui.urls[0].url=/candidat/v3/api-docs
springdoc.swagger-ui.urls[1].name=Job
springdoc.swagger-ui.urls[1].url=/jobs/v3/api-docs

#---
spring.config.activate.on-profile=static
eureka.client.enabled=false
gateway.services.candidat=http://localhost:8081
gateway.services.job=http://localhost:8082
gateway.services.candidature=http://localhost:8085
gateway.services.meeting=http://localhost:8083
gateway.services.notification=http://localhost:8084

#---
spring.config.activate.on-profile=!java-routes
spring.cloud.gateway.server.webflux.routes[0].id=candidat-docs
spring.cloud.gateway.server.webflux.routes[0].uri=${gateway.services.candidat}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/candidat/v3/api-docs
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/candidat/v3/api-docs, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[1].id=job-docs
spring.cloud.gateway.server.webflux.routes[1].uri=${gateway.services.job}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/jobs/v3/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/jobs/v3/api-docs, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[2].id=candidat
spring.cloud.gateway.server.webflux.routes[2].uri=${gateway.services.candidat}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/mic1/candidates/**,/mic1/addresses/**

spring.cloud.gateway.server.webflux.routes[3].id=job
spring.cloud.gateway.server.webflux.routes[3].uri=${gateway.services.job}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/jobs/**,/api/categories/**

spring.cloud.gateway.server.webflux.routes[4].id=candidature
spring.cloud.gateway.server.webflux.routes[4].uri=${gateway.services.candidature}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/mic3/candidature/**

spring.cloud.gateway.server.webflux.routes[5].id=meeting
spring.cloud.gateway.server.webflux.routes[5].uri=${gateway.services.meeting}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/meetings/**

spring.cloud.gateway.server.webflux.routes[6].id=notification
spring.cloud.gateway.server.webflux.routes[6].uri=${gateway.services.notification}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/notifications/**

#---
spring.config.activate.on-profile=routing-logs
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.gateway.filter.ReactiveLoadBalancerClientFilter=TRACE
logging.level.reactor.netty.http.client=DEBUG
